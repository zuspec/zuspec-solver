[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zuspec-solver"
dynamic = ["version"]
description = "Zuspec IR solve problems, translated for constraint solvers (dv-solve)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Matthew Ballance", email = "matt.ballance@gmail.com"}
]

dependencies = [
    # ScSolveProblem and the constraint/expression IR the walk reads.
    "zuspec-ir-core>=0.2.0",
    # build_solve_blob fills dv-solve's growable builder.
    "dv-solve>=0.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

# Auto-discovery: zuspec/ is a PEP 420 namespace dir.
[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
