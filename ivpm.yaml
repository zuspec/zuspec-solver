package:
  name: zuspec-solver

  dep-sets:
  - name: use
    deps: []
  - name: default 
    uses: use
  - name: default-dev
    uses: dev

  - name: dev
    uses: [use, dev-tools]
    deps:
    - name: zuspec-dataclasses
      url: https://github.com/zuspec/zuspec-dataclasses.git
    - name: zuspec-ir-core
      url: https://github.com/zuspec/zuspec-ir-core.git
    - name: dv-flow-mgr
      url: https://github.com/dv-flow/dv-flow-mgr.git
    - name: dv-solve
      url: https://github.com/fvutils/dv-solve.git
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git

  - name: dev-tools
    deps:
    - name: pytest
      src: pypi
    - name: pytest-dfm
      url: https://github.com/dv-flow/pytest-dfm.git
