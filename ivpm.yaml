package:
  name: zuspec-solver

  dep-sets:
  - name: use
    deps: []
  - name: default
    uses: use
  - name: default-dev
    uses: dev

  - name: dev
    uses: [use, dev-tools]
    default-dep-set: default-dev
    deps:
    - name: zuspec-ir-core
      url: https://github.com/zuspec/zuspec-ir-core.git
    - name: dv-solve
      url: https://github.com/fvutils/dv-solve.git
      dep-set: dev

  - name: dev-tools
    default-dep-set: default
    deps:
    - name: pytest
      src: pypi
