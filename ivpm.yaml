package:
    name: zuspec-solver

    # default-dev first: `ivpm update` takes the FIRST dep-set when none is
    # named, and CI names none. With the empty `use` set first, no venv was
    # made and CI died at ./packages/python/bin/pip.
    dep-sets:
    - name: default-dev
      uses: default
      deps:
      - name: pytest
        src: pypi

    - name: default
      deps:
      - name: zuspec-ir-core
        url: https://github.com/zuspec/zuspec-ir-core.git
      # The PyPI wheel carries the native library; a git checkout would
      # need a CMake build first.
      - name: dv-solve
        src: pypi
